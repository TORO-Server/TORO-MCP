name: ci

# main へのプッシュとタグ (v*) で、試験に通ったイメージを GHCR (ghcr.io/<owner>/<repo>) に置く。プルリクエストは試験とビルドだけ (置かない)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: rustup component add rustfmt clippy

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

      # 既知の脆弱性 (RustSec) を Cargo.lock で調べる
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GHCR の名前は小文字だけ
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 発行済みのタグを上書きしない。バージョンのタグ (v*) とコミットのタグ (sha-) が GHCR に既にあれば失敗にする
      # (latest と、メジャー.マイナーのタグは、動かす前提なので対象外。タグの実行は同じコミットの sha- を main の実行が先に置くため見ない。やり直しの実行でも sha- を見ない)
      - name: 同名のタグが無いことを確かめる
        if: github.event_name != 'pull_request'
        run: |
          check() {
            if docker buildx imagetools inspect "$IMAGE:$1" > /dev/null 2>&1; then
              echo "::error::$IMAGE:$1 は発行済みです。上書きしません。別のタグ名にしてください"
              exit 1
            fi
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            check "${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
            check "sha-${GITHUB_SHA::7}"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
