[package]
name = "toro-mcp"
version = "2.0.1"
edition = "2024"
description = "TORO Server の AI コネクタ (Remote MCP サーバー)"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
# scratch イメージで動かすので、CA 証明書は OS から読まない (rustls-tls = webpki-roots を埋め込む)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
